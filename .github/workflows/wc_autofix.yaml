---
name: autofix (workflow_call)
on:
  workflow_call:
    secrets:
      TAKUMI_GUARD_BOT_ID:
        required: true
permissions: {}
jobs:
  jsmodule:
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write # Required for OIDC
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - uses: flatt-security/setup-takumi-guard-npm@v1.4.0
        with:
          bot-id: ${{secrets.TAKUMI_GUARD_BOT_ID}}
      # Install only prettier instead of all packages
      - run: npm ci
        working-directory: .github/prettier

      # Archive node_modules with tar to keep file permissions and symlinks (e.g. node_modules/.bin)
      - run: tar -cf "$RUNNER_TEMP/node_modules.tar" node_modules
        working-directory: .github/prettier
      - uses: actions/upload-artifact@v7.0.2
        with:
          path: ${{runner.temp}}/node_modules.tar
          name: node_modules
          retention-days: 1

  autofix:
    runs-on: ubuntu-26.04
    needs: jsmodule
    permissions: {}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version

      - uses: actions/download-artifact@v8.0.2
        with:
          name: node_modules
          path: ${{runner.temp}}
      - run: tar -xf "$RUNNER_TEMP/node_modules.tar"
        working-directory: .github/prettier

      - uses: aquaproj/aqua-installer@v4.1.1
        with:
          aqua_version: v2.66.0
      - run: aqua upc -prune
        env:
          AQUA_GITHUB_TOKEN: ${{github.token}}
      # Run prettier directly because npm run fmt runs npm ci without Takumi Guard authentication
      - run: .github/prettier/node_modules/.bin/prettier --write .
      - run: pinact run -u README.md
        if: ${{ !github.event.pull_request.head.repo.fork }}
      - uses: autofix-ci/action@v1.3.4
