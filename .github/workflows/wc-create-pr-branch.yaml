---
name: Release (workflow call)
on:
  workflow_call:
    inputs:
      version:
        description: Version
        required: true
        type: string
      pr:
        description: Pull Request Number
        required: false
        type: string
      is_comment:
        description: If the comment is posted
        required: false
        default: false
        type: boolean
    secrets:
      TAKUMI_GUARD_BOT_ID:
        required: true
jobs:
  jsmodule:
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
      id-token: write # Required for OIDC
    outputs:
      sha: ${{steps.sha.outputs.value}}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh pr checkout "$PR"
        if: inputs.pr != ''
        env:
          GITHUB_TOKEN: ${{github.token}}
          PR: ${{inputs.pr}}
      - id: sha
        run: echo "value=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - uses: flatt-security/setup-takumi-guard-npm@v1.4.0
        with:
          bot-id: ${{secrets.TAKUMI_GUARD_BOT_ID}}
      - run: npm ci

      # Archive node_modules with tar to keep file permissions and symlinks (e.g. node_modules/.bin)
      - run: tar -cf "$RUNNER_TEMP/node_modules.tar" node_modules
      - uses: actions/upload-artifact@v7.0.2
        with:
          path: ${{runner.temp}}/node_modules.tar
          name: node_modules-create-pr-branch
          retention-days: 1

  create-pr-branch:
    timeout-minutes: 20
    runs-on: ubuntu-26.04
    needs: jsmodule
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh pr checkout "$PR"
        if: inputs.pr != ''
        env:
          GITHUB_TOKEN: ${{github.token}}
          PR: ${{inputs.pr}}
      # Fail if the pull request was updated after node_modules was installed
      - run: test "$(git rev-parse HEAD)" = "$SHA"
        env:
          SHA: ${{needs.jsmodule.outputs.sha}}
      - run: node -v
      - run: npm -v

      - uses: actions/download-artifact@v8.0.2
        with:
          name: node_modules-create-pr-branch
          path: ${{runner.temp}}
      - run: tar -xf "$RUNNER_TEMP/node_modules.tar"

      - run: npm run build

      # Pull requests from forks can't push branches, so only build them
      - if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: suzuki-shunsuke/release-js-action@v0.2.1
        with:
          version: ${{inputs.version}}
          pr: ${{inputs.pr}}
          is_comment: ${{inputs.is_comment}}

      # Test
      - if: github.event_name == 'pull_request'
        uses: ./
        id: pr-diff

      - if: github.event_name == 'pull_request'
        env:
          DIFF_PATH: ${{ steps.pr-diff.outputs.diff_path }}
          SIZE: ${{ steps.pr-diff.outputs.size }}
        run: cat "$DIFF_PATH"

      - uses: ./
        id: pr-diff-2
        with:
          # https://github.com/suzuki-shunsuke/go-ci-env/pull/35
          repository: suzuki-shunsuke/go-ci-env
          pr_number: 35
      - env:
          DIFF_PATH: ${{ steps.pr-diff-2.outputs.diff_path }}
          SIZE: ${{ steps.pr-diff-2.outputs.size }}
        run: cat "$DIFF_PATH"
